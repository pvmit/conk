<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Koło — Awantura o kasę</title>
  <style>
    :root {
      --bg: #121826;
      --panel: #1a2233;
      --ink: #eef1f6;
      --muted: #9aa3b5;
      --line: #2c364c;
      --yellow: #e8c200;
      --red: #e23d4a;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100%;
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: auto;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
      line-height: 1.1;
    }
    .sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .tab, button { font: inherit; cursor: pointer; }
    .tab, .ghost, .spin, .card button {
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #121826;
      color: var(--ink);
      padding: 8px 10px;
    }
    .tab.active, .card .primary, .spin {
      background: var(--yellow);
      color: #121826;
      border-color: var(--yellow);
      font-weight: 800;
    }

    .list { list-style: none; margin: 0; padding: 0; }
    .list li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    .list li.gone { color: #6b7386; text-decoration: line-through; }
    .tag { font-size: 11px; color: var(--muted); }
    .tag.knowledge { color: #8eb6e8; }

    .hint { font-size: 12px; color: var(--muted); margin: 0; }

    .actions { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
    .ghost:hover { background: #243049; }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 16px;
      background: #0e1420;
    }

    .wheel-wrap {
      position: relative;
      width: min(78vh, 70vw, 720px);
      height: min(78vh, 70vw, 720px);
    }

    .pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 32px solid var(--red);
    }

    .wheel-rot { width: 100%; height: 100%; transition: none; }
    .wheel-rot.spinning {
      transition: transform 4.6s cubic-bezier(0.12, 0.62, 0.08, 1);
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #eef1f6;
      background: #eef1f6;
    }

    .hub {
      position: absolute;
      inset: 39%;
      background: #eef1f6;
      border: 5px solid #121826;
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
    }

    .spin {
      margin-top: 22px;
      padding: 12px 36px;
      font-size: 20px;
    }
    .spin:disabled { opacity: 0.4; cursor: not-allowed; }

    .log { font-size: 13px; }
    .log .item {
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
    }
    .log .n { color: var(--muted); font-size: 11px; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 20, .7);
      display: none;
      place-items: center;
      z-index: 10;
      padding: 24px;
    }
    .overlay.show { display: grid; }
    .card {
      background: #1a2233;
      border: 1px solid var(--line);
      padding: 28px 26px 22px;
      width: min(900px, 96%);
      max-height: 90vh;
      overflow: auto;
      text-align: center;
    }
    .card .kind {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .card h2 {
      margin: 0 0 14px;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.15;
    }
    .card .question {
      text-align: left;
      font-size: clamp(18px, 2.5vw, 28px);
      line-height: 1.4;
      margin: 0 0 18px;
    }
    .card .abcd {
      text-align: left;
      margin: 0 0 18px;
      padding-left: 1.2em;
      font-size: clamp(16px, 2.1vw, 22px);
      line-height: 1.4;
    }
    .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .card button { padding: 10px 16px; }

    @media (max-width: 960px) {
      body { overflow: auto; }
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        height: auto;
      }
      .wheel-wrap { width: min(88vw, 440px); height: min(88vw, 440px); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div>
        <h1>Awantura o kasę</h1>
        <p class="sub">Świat cyfrowy</p>
      </div>
      <div class="tabs">
        <button class="tab active" id="tab-etap1" type="button">Etap 1</button>
        <button class="tab" id="tab-final" type="button">Finał</button>
      </div>
      <div>
        <p class="sub" style="margin-bottom:8px">Na kole</p>
        <ul class="list" id="remaining"></ul>
      </div>
      <div>
        <p class="sub" style="margin-bottom:8px">Wylosowane</p>
        <div class="log" id="log"></div>
      </div>
      <div class="actions">
        <button class="ghost" id="fullscreen" type="button">Pełny ekran</button>
        <button class="ghost" id="reset-stage" type="button">Reset etapu</button>
        <button class="ghost" id="reset-all" type="button">Reset całej gry</button>
      </div>
    </aside>

    <main class="stage">
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <div class="wheel-rot" id="rot">
          <canvas id="wheel" width="900" height="900"></canvas>
        </div>
        <div class="hub" aria-hidden="true"></div>
      </div>
      <button class="spin" id="spin" type="button">Kręć kołem</button>
    </main>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <p class="kind" id="result-kind"></p>
      <h2 id="result-title"></h2>
      <p class="question" id="result-question"></p>
      <ol class="abcd" id="result-abcd" hidden></ol>
      <div class="row" id="result-actions"></div>
    </div>
  </div>

  <script>
    const STAGES = {

          { id: "meta", label: "Metadane", short: "METADANE", type: "knowledge", color: "#1e8449" },
          { id: "hint2", label: "Podpowiedź", short: "PODPOWIEDŹ", type: "special", color: "#d4a017" },
          { id: "skin", label: "Gry — darmowy skin", short: "SKIN", type: "knowledge", color: "#1a5276" },
          { id: "ransom", label: "Ransomware", short: "RANSOM", type: "knowledge", color: "#7b241c" },
          { id: "algo", label: "Algorytmy", short: "ALGORYTM", type: "knowledge", color: "#4a235a" },
          { id: "micro", label: "Gry i mikropłatności", short: "MIKROPŁAT.", type: "knowledge", color: "#6e2c00" },
          { id: "hint3", label: "Podpowiedź", short: "PODPOWIEDŹ", type: "special", color: "#d4a017" },
          { id: "wellbeing", label: "Cyfrowy dobrostan", short: "DOBROSTAN", type: "knowledge", color: "#0e6655" },

          { id: "perms", label: "Uprawnienia aplikacji", short: "UPRAWNIENIA", type: "knowledge", color: "#0e6655" },

    const QUESTIONS = {
      phishing: {
        text: "Dostałaś SMS: „Paczka InPost zatrzymana. Dopłać 2,99 zł: inpost-pl-oplata.shop/pay”. Podaj co najmniej dwa sygnały, że to oszustwo, i co robisz zamiast klikać.",
        abcd: ["Płacę, bo 2,99 zł to mało.", "Klikam, ale nie wpisuję karty.", "Sprawdzam przesyłkę w oficjalnej apce / na stronie wpisanej sam i nie klikam linku z SMS-a.", "Odpisuję „STOP”, żeby ich zdemaskować."]
      },

        text: "Dlaczego kod z SMS-a jest słabszym 2FA niż aplikacja authenticator (albo klucz)? I po co są kody zapasowe / recovery?",

      },
      license: {
        text: "Kupujesz grę cyfrową za 250 zł. Po trzech latach znika ona ze sklepu. Jedna osoba mówi: „straciłeś ją natychmiast”, druga: „zapłaciłem, więc jest moja na zawsze i platforma nie ma nic do gadania”. Kto ma rację? Wyjaśnij, co najczęściej kupujesz i podaj jedno ograniczenie w porównaniu z fizyczną kopią.",
        abcd: ["Gra usunięta ze sklepu zawsze natychmiast znika wszystkim z biblioteki.", "Zwykle kupujesz licencję przypisaną do konta; delisting często nie odbiera gry obecnym użytkownikom, ale dostęp zależy od platformy i jej zasad.", "Zapłata oznacza, że wolno sprzedać konto i dowolnie kopiować grę.", "Gra cyfrowa i fizyczna dają zawsze dokładnie te same prawa."]
      },
      szyfr: {
        text: "Co znaczy, że czat jest szyfrowany end-to-end? Podaj jedną rzecz, przed którą to nie chroni.",
        abcd: ["Nawet odbiorca nie może zrobić screenshota.", "Policja nigdy nie przeczyta, cokolwiek zrobisz.", "Serwer nie czyta treści; screenshot, drugi człowiek i chory telefon nadal mogą wyciec.", "E2E znaczy, że wiadomość kasuje się po 5 s."]
      },
      deepfake: {
        text: "Na TikToku leci film: polityk „ogłasza” wojnę. Zanim prześlesz to dalej „żeby wiedzieli”: jak weryfikujesz (min. 2 sposoby) i dlaczego samo udostępnienie „w ramach ostrzeżenia” szkodzi?",
        abcd: ["Jak film jest ostry, na pewno prawdziwy.", "Wrzuć z dopiskiem „nie wiem czy prawda”. To zdejmuje odpowiedzialność.", "Sprawdź źródło i czy potwierdzają to niezależne media; nie puszczaj dalej „na wszelki wypadek”.", "AI zawsze zostawia znak wodny."]
      },
      meta: {
        text: "Co może zawierać oryginalny plik zdjęcia z wakacji oprócz samego obrazu? Podaj dwa przykłady i co zrobić przed wrzuceniem fotki publicznie.",
        abcd: ["W pliku jest tylko obraz, reszta ginie przy wysyłce.", "Mogą być GPS, data, model telefonu; wyłącz lokalizację i sprawdź plik przed wrzuceniem.", "Metadane widać tylko na komputerze CIA.", "Wystarczy filtr na Insta."]
      },
      skin: {
        text: "Znajomy na Discordzie wysyła stronę: „Zaloguj się przez Steam i odbierz darmowy skin”. Strona wygląda jak Steam, a oferta znika za 10 minut. Podaj dwa sygnały oszustwa i powiedz, co robisz, jeśli zdążyłeś już wpisać login i hasło.",
        abcd: ["Loguję się, bo link przyszedł od znajomego.", "Sprawdzam domenę; jeśli podałem dane, sam wchodzę na Steam, zmieniam hasło i wylogowuję inne sesje.", "Wystarczy usunąć wiadomość na Discordzie.", "Podaję kod 2FA, żeby potwierdzić odbiór skina."]
      },
      ransom: {
        text: "Co to jest ransomware? Co robisz od razu po wykryciu i co jest prawdziwą obroną na co dzień?",
        abcd: ["Płacę szybko, bo taniej niż backup.", "Odłączam od sieci, zgłaszam dorosłemu; na co dzień backup offline i nie otwieram dziwnych załączników.", "Formatuję dysk natychmiast, bez słowa.", "To tylko straszak, na telefonie nie ma ransomware."]
      },
      algo: {
        text: "Przez kilka dni oglądasz na TikToku filmy o teorii spiskowej — nie dlatego, że w nią wierzysz, tylko „dla beki”. Po chwili cała tablica jest nimi wypełniona. Dlaczego algorytm pokazuje ich coraz więcej i jak możesz zmienić swoją tablicę?",
        abcd: ["TikTok sprawdził, w co naprawdę wierzysz.", "Długie oglądanie jest sygnałem zainteresowania; pomogą „nie interesuje mnie” i świadome oglądanie innych tematów.", "Algorytm losuje filmy i niczego nie zapamiętuje.", "Jedynym rozwiązaniem jest nowy telefon."]
      },
      micro: {
        text: "W grze skórka kosztuje 1200 kryształów. Możesz kupić 1000 kryształów za 19,99 zł albo 2500 za 39,99 zł. Oferta znika za godzinę. Dlaczego gra nie pokazuje po prostu ceny skórki w złotówkach? Podaj dwa mechanizmy, które mają skłonić cię do wydania więcej.",
        abcd: ["Kryształy pomagają szybko policzyć cenę.", "Waluta zasłania cenę, niedopasowane paczki zostawiają resztę, a zegar tworzy presję.", "Oferta czasowa zawsze jest najtańsza.", "Niewydane kryształy automatycznie wracają na konto bankowe."]
      },
      wellbeing: {
        text: "Otwierasz telefon „tylko sprawdzić wiadomość”, a po 40 minutach nadal przewijasz rolki. Podaj dwa rozwiązania w aplikacjach, które utrudniają odłożenie telefonu, i dwie rzeczy, które możesz zmienić u siebie.",
        abcd: ["To wyłącznie brak silnej woli użytkownika.", "Autoplay, nieskończony feed i powiadomienia zatrzymują uwagę; pomagają limity, tryb skupienia i wyłączenie powiadomień.", "Trzeba ładować telefon do 100%.", "Najlepiej włączyć wszystkie powiadomienia, żeby szybciej je zamknąć."]
      },
      cloud: {
        text: "Zdjęcia z telefonu są synchronizowane z chmurą. Usuwasz zdjęcie z galerii, żeby zwolnić miejsce. Kolega twierdzi, że kopia na pewno zostanie w chmurze. Czy ma rację? Co trzeba sprawdzić przed usuwaniem?",
        abcd: ["Wszystko wysłane do chmury zostaje tam na zawsze.", "Synchronizacja może powtórzyć usunięcie wszędzie; przed kasowaniem sprawdź ustawienia, kosz i niezależny backup.", "Chmura działa tylko podczas deszczu.", "Wystarczy mieć wolne miejsce w telefonie."]
      },
      wifi: {
        text: "Telefon pokazuje pełny zasięg Wi-Fi, ale żadna strona się nie otwiera. Czy to możliwe? Wyjaśnij różnicę między Wi-Fi a internetem i podaj jedną rzecz, którą sprawdzasz.",
        abcd: ["Pełne kreski oznaczają, że każda strona musi działać.", "Telefon może widzieć router, mimo że router stracił połączenie z internetem.", "Wi-Fi i internet to dwie nazwy dokładnie tej samej rzeczy.", "Problem zawsze oznacza wirusa."]
      },
      hijack: {
        text: "Znajoma pisze na Discordzie z prośbą o BLIK. Chwilę później z jej konta lecą linki do „darmowych skinów”. Ona ma dostęp do telefonu, ale nie może zalogować się na Discorda. Co prawdopodobnie się stało i jakie trzy działania powinna wykonać w pierwszej kolejności?"
      },
      phone: {
        text: "Po wyjściu z autobusu orientujesz się, że nie masz telefonu. Nie wiesz, czy został na siedzeniu, czy ktoś go zabrał. Telefon nie miał blokady ekranu, a są na nim zalogowane poczta, media społecznościowe i aplikacja bankowa. Podaj trzy najważniejsze działania i określ, co robisz najpierw."
      },
      screenshot: {
        text: "Na klasową grupę trafia screenshot wiadomości: „Jutro lekcje odwołane z powodu awarii budynku”. Nie ma linku ani pełnej nazwy nadawcy. Jedna osoba chce natychmiast rozesłać go dalej, druga twierdzi, że screenshot jest wystarczającym dowodem. Jak w ciągu kilku minut sprawdzacie, czy informacja jest prawdziwa?"
      },
      perms: {
        text: "Instalujesz darmową aplikację do przerabiania zdjęć. Prosi o dostęp do zdjęć, dokładnej lokalizacji, mikrofonu, kontaktów i działania cały czas w tle. Które uprawnienia mogą być uzasadnione, które są podejrzane i co robisz, jeśli bez zaakceptowania wszystkich aplikacja nie chce działać?"
      }

    const KEY = "aok-kolo-v6";
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const rot = document.getElementById("rot");
    const spinBtn = document.getElementById("spin");
    const overlay = document.getElementById("overlay");

    let stage = "etap1";
    let remaining = {
      etap1: STAGES.etap1.items.map((x) => x.id),
      final: STAGES.final.items.map((x) => x.id)
    };
    let history = [];
    let rotation = 0;
    let spinning = false;
    let pending = null;

    function catalog(id) {
      return [...STAGES.etap1.items, ...STAGES.final.items].find((x) => x.id === id);
    }

    function itemsNow() {
      return remaining[stage].map(catalog).filter(Boolean);
    }

    function save() {
      sessionStorage.setItem(KEY, JSON.stringify({ stage, remaining, history }));
    }

    function load() {
      try {
        const raw = sessionStorage.getItem(KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.remaining && data.history) {
          remaining = data.remaining;
          history = data.history;
          stage = data.stage === "final" ? "final" : "etap1";
        }
      } catch (_) {}
    }

    function inkOn(hex) {
      const n = parseInt(String(hex).replace("#", ""), 16);
      const r = (n >> 16) & 255;
      const g = (n >> 8) & 255;
      const b = n & 255;
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
      return lum > 140 ? "#171717" : "#eef1f6";
    }

    function drawWheel() {
      const items = itemsNow();
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const r = w / 2 - 8;
      ctx.clearRect(0, 0, w, h);

      if (!items.length) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = "#0e1420";
        ctx.fill();
        ctx.fillStyle = "#eef1f6";
        ctx.font = "28px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Brak kategorii", cx, cy - 10);
        return;
      }

      const slice = (Math.PI * 2) / items.length;
      items.forEach((item, i) => {
        const start = -Math.PI / 2 - slice / 2 + i * slice;
        const end = start + slice;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, end);
        ctx.closePath();
        ctx.fillStyle = item.color;
        ctx.fill();
        ctx.strokeStyle = "rgba(23,23,23,.35)";
        ctx.lineWidth = 3;
        ctx.stroke();

        const mid = start + slice / 2;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(mid);
        const flip = Math.cos(mid) < 0;
        if (flip) ctx.rotate(Math.PI);
        ctx.fillStyle = inkOn(item.color);
        ctx.font = `700 ${items.length > 12 ? 18 : items.length > 8 ? 20 : items.length > 5 ? 26 : 30}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(item.short, flip ? -(r * 0.62) : r * 0.62, 0);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = "#eef1f6";
      ctx.lineWidth = 8;
      ctx.stroke();
    }

    function renderLists() {
      const box = document.getElementById("remaining");
      box.innerHTML = "";
      STAGES[stage].items.forEach((item) => {
        const li = document.createElement("li");
        if (!remaining[stage].includes(item.id)) li.classList.add("gone");
        li.innerHTML = `<span>${item.label}</span><span class="tag ${item.type}">${item.type === "special" ? "specjalne" : "wiedza"}</span>`;
        box.appendChild(li);
      });

      document.getElementById("tab-etap1").classList.toggle("active", stage === "etap1");
      document.getElementById("tab-final").classList.toggle("active", stage === "final");

      const log = document.getElementById("log");
      log.innerHTML = history.length
        ? history.map((h, i) => {
            const item = catalog(h.id);
            return `<div class="item"><div class="n">${i + 1}. ${h.stage === "final" ? "Finał" : "Etap 1"}</div>${item ? item.label : h.id}</div>`;
          }).join("")
        : "";

      spinBtn.disabled = spinning || !itemsNow().length;
    }

    function setStage(next) {
      if (spinning) return;
      stage = next;
      rotation = 0;
      rot.classList.remove("spinning");
      rot.style.transform = "rotate(0deg)";
      save();
      drawWheel();
      renderLists();
    }

    function ding() {
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = "triangle";
        o.frequency.value = 880;
        g.gain.value = 0.04;
        o.connect(g);
        g.connect(ac.destination);
        o.start();
        o.stop(ac.currentTime + 0.18);
      } catch (_) {}
    }

    function openResult(item) {
      pending = item;
      const questionEl = document.getElementById("result-question");
      const abcdEl = document.getElementById("result-abcd");
      questionEl.hidden = true;
      questionEl.textContent = "";
      abcdEl.hidden = true;
      abcdEl.innerHTML = "";
      document.getElementById("result-title").textContent = item.label;
      const actions = document.getElementById("result-actions");
      actions.innerHTML = "";

      if (item.type === "special") {
        document.getElementById("result-kind").textContent = "Pole specjalne — licytacja";
        const keep = document.createElement("button");
        keep.textContent = "Zostaw na kole";
        keep.onclick = () => finishDraw(false);
        const take = document.createElement("button");
        take.className = "primary";
        take.textContent = "Wylicytowane — zdejmij";
        take.onclick = () => finishDraw(true);
        actions.append(keep, take);
      } else {
        document.getElementById("result-kind").textContent = "Licytacja";
        const ask = document.createElement("button");
        ask.className = "primary";
        ask.textContent = "Pokaż pytanie";
        ask.onclick = revealQuestion;
        actions.append(ask);
      }
      overlay.classList.add("show");
    }

    function revealQuestion() {
      if (!pending) return;
      const q = QUESTIONS[pending.id];
      const questionEl = document.getElementById("result-question");
      const abcdEl = document.getElementById("result-abcd");
      document.getElementById("result-kind").textContent = "Pytanie";
      questionEl.textContent = q ? q.text : "";
      questionEl.hidden = !q;
      abcdEl.hidden = true;
      abcdEl.innerHTML = "";
      const actions = document.getElementById("result-actions");
      actions.innerHTML = "";
      if (q && q.abcd) {
        const hintBtn = document.createElement("button");
        hintBtn.textContent = "Pokaż ABCD";
        hintBtn.onclick = () => {
          abcdEl.innerHTML = q.abcd.map((opt, i) => `<li>${"ABCD"[i]}) ${opt}</li>`).join("");
          abcdEl.hidden = false;
          hintBtn.remove();
        };
        actions.append(hintBtn);
      }
      const ok = document.createElement("button");
      ok.className = "primary";
      ok.textContent = "Dalej";
      ok.onclick = () => finishDraw(true);
      actions.append(ok);
    }

    function finishDraw(remove) {
      if (!pending) return;
      if (remove && remaining[stage].includes(pending.id)) {
        remaining[stage] = remaining[stage].filter((id) => id !== pending.id);
      }
      pending = null;
      overlay.classList.remove("show");
      rotation = 0;
      rot.classList.remove("spinning");
      rot.style.transform = "rotate(0deg)";
      save();
      drawWheel();
      renderLists();
    }

    function spin() {
      const items = itemsNow();
      if (spinning || !items.length) return;
      spinning = true;
      spinBtn.disabled = true;
      const index = Math.floor(Math.random() * items.length);
      const sliceDeg = 360 / items.length;
      const center = index * sliceDeg;
      const extra = 360 * (5 + Math.floor(Math.random() * 3));
      const target = extra + (360 - center);
      rotation = rotation + target;
      rot.classList.add("spinning");
      rot.style.transform = `rotate(${rotation}deg)`;

      const done = () => {
        rot.removeEventListener("transitionend", done);
        spinning = false;
        const item = items[index];
        history.unshift({ id: item.id, stage });
        ding();
        save();
        renderLists();
        openResult(item);
      };
      rot.addEventListener("transitionend", done);
    }

    function resetStage() {
      if (spinning) return;
      remaining[stage] = STAGES[stage].items.map((x) => x.id);
      history = history.filter((h) => h.stage !== stage);
      rotation = 0;
      rot.classList.remove("spinning");
      rot.style.transform = "rotate(0deg)";
      save();
      drawWheel();
      renderLists();
    }

    function resetAll() {
      if (spinning) return;
      remaining = {
        etap1: STAGES.etap1.items.map((x) => x.id),
        final: STAGES.final.items.map((x) => x.id)
      };
      history = [];
      rotation = 0;
      rot.classList.remove("spinning");
      rot.style.transform = "rotate(0deg)";
      save();
      drawWheel();
      renderLists();
    }

    document.getElementById("tab-etap1").onclick = () => setStage("etap1");
    document.getElementById("tab-final").onclick = () => setStage("final");
    spinBtn.onclick = spin;
    document.getElementById("reset-stage").onclick = resetStage;
    document.getElementById("reset-all").onclick = resetAll;
    document.getElementById("fullscreen").onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
    document.addEventListener("keydown", (e) => {
      if (overlay.classList.contains("show")) {
        const questionEl = document.getElementById("result-question");
        if (e.code === "Enter" && pending && pending.type !== "special" && questionEl.hidden) {
          e.preventDefault();
          revealQuestion();
        }
        return;
      }
      if (e.code === "Space") {
        e.preventDefault();
        spin();
      }
    });

    load();
    drawWheel();
    renderLists();
  </script>
</body>
</html>
