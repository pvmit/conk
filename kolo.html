<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Koło — Awantura o kasę</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #10182a;
      --line: #2a3a5c;
      --gold: #f0c14b;
      --gold-2: #d4a017;
      --text: #f4f1e8;
      --muted: #9aa7c2;
      --special: #f0c14b;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #1b2a4d 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: 100%;
      gap: 0;
    }

    aside {
      background: rgba(16, 24, 42, 0.92);
      border-right: 1px solid var(--line);
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: auto;
    }

    h1 {
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 0 0 4px;
    }
    .sub { color: var(--muted); font-size: 13px; margin: 0; }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .tab, button {
      font: inherit;
      cursor: pointer;
    }
    .tab {
      background: #0c1322;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 8px;
    }
    .tab.active {
      background: linear-gradient(180deg, #f0c14b, #c49212);
      color: #1a1203;
      border-color: #f6d77a;
      font-weight: 700;
    }

    .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #0c1322;
      border: 1px solid var(--line);
      font-size: 14px;
    }
    .list li.gone {
      opacity: 0.35;
      text-decoration: line-through;
    }
    .tag {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .tag.knowledge { color: #8fd3ff; }

    .hint {
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }

    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
    .ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }
    .ghost:hover { color: var(--text); border-color: var(--gold); }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      min-width: 0;
      padding: 12px;
    }

    .wheel-wrap {
      position: relative;
      width: min(78vh, 70vw, 720px);
      height: min(78vh, 70vw, 720px);
    }

    .pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 36px solid var(--gold);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.6));
    }

    .wheel-rot {
      width: 100%;
      height: 100%;
      transition: none;
    }
    .wheel-rot.spinning {
      transition: transform 4.6s cubic-bezier(0.12, 0.62, 0.08, 1);
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow:
        0 0 0 10px #0c1322,
        0 0 0 14px var(--gold-2),
        0 30px 80px rgba(0,0,0,.55);
    }

    .hub {
      position: absolute;
      inset: 38%;
      background: radial-gradient(circle at 35% 30%, #ffe08a, #b8860b 55%, #6b4c08);
      border-radius: 50%;
      display: grid;
      place-items: center;
      z-index: 2;
      box-shadow: inset 0 2px 8px rgba(255,255,255,.35), 0 8px 20px rgba(0,0,0,.45);
      color: #1a1203;
      font-weight: 800;
      letter-spacing: 0.12em;
      font-size: clamp(11px, 1.6vh, 16px);
      text-align: center;
      line-height: 1.15;
      pointer-events: none;
    }

    .spin {
      margin-top: 28px;
      background: linear-gradient(180deg, #ffe08a, #d4a017);
      color: #1a1203;
      border: 0;
      border-radius: 999px;
      padding: 14px 42px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      box-shadow: 0 10px 24px rgba(212, 160, 23, .35);
    }
    .spin:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .log { font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
    .log .item {
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .log .n { color: var(--gold); font-size: 11px; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 16, .72);
      display: none;
      place-items: center;
      z-index: 10;
      padding: 24px;
    }
    .overlay.show { display: grid; }
    .card {
      background: #10182a;
      border: 1px solid var(--gold-2);
      border-radius: 20px;
      padding: 32px 28px 24px;
      width: min(520px, 100%);
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,.5);
    }
    .card .kind {
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--gold);
      margin: 0 0 8px;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.1;
    }
    .card p { color: var(--muted); margin: 0 0 22px; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .card button {
      border-radius: 999px;
      padding: 12px 18px;
      border: 1px solid var(--line);
      background: #0c1322;
      color: var(--text);
    }
    .card .primary {
      background: linear-gradient(180deg, #ffe08a, #d4a017);
      color: #1a1203;
      border: 0;
      font-weight: 700;
    }

    @media (max-width: 960px) {
      body { overflow: auto; }
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        height: auto;
      }
      .wheel-wrap { width: min(88vw, 440px); height: min(88vw, 440px); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div>
        <h1>Awantura o kasę</h1>
        <p class="sub">Świat cyfrowy — koło kategorii</p>
      </div>
      <div class="tabs">
        <button class="tab active" id="tab-etap1" type="button">Etap 1</button>
        <button class="tab" id="tab-final" type="button">Finał</button>
      </div>
      <div>
        <p class="sub" style="margin-bottom:8px">Na kole</p>
        <ul class="list" id="remaining"></ul>
      </div>
      <p class="hint">
        Wiedza znika po wylosowaniu. W etapie 1 jest więcej kategorii niż pytań — część nie wypadnie. Trzy pola podpowiedzi i skrzynka zostają, aż oznaczysz je jako wylicytowane.
      </p>
      <div>
        <p class="sub" style="margin-bottom:8px">Wylosowane</p>
        <div class="log" id="log"></div>
      </div>
      <div class="actions">
        <button class="ghost" id="fullscreen" type="button">Pełny ekran</button>
        <button class="ghost" id="reset-stage" type="button">Reset etapu</button>
        <button class="ghost" id="reset-all" type="button">Reset całej gry</button>
      </div>
    </aside>

    <main class="stage">
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <div class="wheel-rot" id="rot">
          <canvas id="wheel" width="900" height="900"></canvas>
        </div>
        <div class="hub">KASA</div>
      </div>
      <button class="spin" id="spin" type="button">Kręć kołem</button>
    </main>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <p class="kind" id="result-kind"></p>
      <h2 id="result-title"></h2>
      <p id="result-note"></p>
      <div class="row" id="result-actions"></div>
    </div>
  </div>

  <script>
    const STAGES = {
      etap1: {
        name: "Etap 1",
        items: [
          { id: "phishing", label: "Phishing", short: "PHISHING", type: "knowledge", color: "#c0392b" },
          { id: "hasla", label: "Hasła i 2FA", short: "HASŁA", type: "knowledge", color: "#2471a3" },
          { id: "hint1", label: "Podpowiedź", short: "PODPOWIEDŹ", type: "special", color: "#d4a017" },
          { id: "slad", label: "Ślad cyfrowy", short: "ŚLAD", type: "knowledge", color: "#6c3483" },
          { id: "szyfr", label: "Szyfrowanie", short: "SZYFR", type: "knowledge", color: "#117a65" },
          { id: "deepfake", label: "Deepfake", short: "DEEPFAKE", type: "knowledge", color: "#b9770e" },
          { id: "hint2", label: "Podpowiedź", short: "PODPOWIEDŹ", type: "special", color: "#e8c547" },
          { id: "meta", label: "Metadane", short: "METADANE", type: "knowledge", color: "#1e8449" },
          { id: "vpn", label: "VPN", short: "VPN", type: "knowledge", color: "#1a5276" },
          { id: "ransom", label: "Ransomware", short: "RANSOM", type: "knowledge", color: "#7b241c" },
          { id: "hint3", label: "Podpowiedź", short: "PODPOWIEDŹ", type: "special", color: "#b8860b" },
          { id: "cookies", label: "Cookies", short: "COOKIES", type: "knowledge", color: "#6e2c00" },
          { id: "incognito", label: "Incognito", short: "INCOGNITO", type: "knowledge", color: "#4a235a" }
        ]
      },
      final: {
        name: "Finał",
        items: [
          { id: "prawo", label: "Prawo i wizerunek", short: "PRAWO", type: "knowledge", color: "#5b2c6f" },
          { id: "siec", label: "Sieć publiczna", short: "SIEĆ", type: "knowledge", color: "#1a5276" },
          { id: "presja", label: "Presja w sieci", short: "PRESJA", type: "knowledge", color: "#922b21" },
          { id: "ai", label: "AI", short: "AI", type: "knowledge", color: "#0e6655" },
          { id: "box", label: "Czarna skrzynka", short: "SKRZYNKA", type: "special", color: "#1c1c1c" }
        ]
      }
    };

    const KEY = "aok-kolo-v4";
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const rot = document.getElementById("rot");
    const spinBtn = document.getElementById("spin");
    const overlay = document.getElementById("overlay");

    let stage = "etap1";
    let remaining = {
      etap1: STAGES.etap1.items.map((x) => x.id),
      final: STAGES.final.items.map((x) => x.id)
    };
    let history = [];
    let rotation = 0;
    let spinning = false;
    let pending = null;

    function catalog(id) {
      return [...STAGES.etap1.items, ...STAGES.final.items].find((x) => x.id === id);
    }

    function itemsNow() {
      return remaining[stage].map(catalog).filter(Boolean);
    }

    function save() {
      sessionStorage.setItem(KEY, JSON.stringify({ stage, remaining, history }));
    }

    function load() {
      try {
        const raw = sessionStorage.getItem(KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.remaining && data.history) {
          remaining = data.remaining;
          history = data.history;
          stage = data.stage === "final" ? "final" : "etap1";
        }
      } catch (_) {}
    }

    function drawWheel() {
      const items = itemsNow();
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const r = w / 2 - 8;
      ctx.clearRect(0, 0, w, h);

      if (!items.length) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = "#1b2438";
        ctx.fill();
        ctx.fillStyle = "#9aa7c2";
        ctx.font = "28px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("Brak kategorii", cx, cy - 10);
        return;
      }

      const slice = (Math.PI * 2) / items.length;
      items.forEach((item, i) => {
        const start = -Math.PI / 2 - slice / 2 + i * slice;
        const end = start + slice;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, end);
        ctx.closePath();
        ctx.fillStyle = item.color;
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.18)";
        ctx.lineWidth = 3;
        ctx.stroke();

        const mid = start + slice / 2;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(mid);
        const flip = Math.cos(mid) < 0;
        if (flip) ctx.rotate(Math.PI);
        ctx.fillStyle = item.type === "special" ? "#fff6d4" : "#fff";
        ctx.font = `700 ${items.length > 12 ? 18 : items.length > 8 ? 20 : items.length > 5 ? 26 : 30}px Segoe UI`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(0,0,0,.45)";
        ctx.shadowBlur = 8;
        ctx.fillText(item.short, flip ? -(r * 0.62) : r * 0.62, 0);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = "#f0c14b";
      ctx.lineWidth = 10;
      ctx.stroke();
    }

    function renderLists() {
      const box = document.getElementById("remaining");
      box.innerHTML = "";
      STAGES[stage].items.forEach((item) => {
        const li = document.createElement("li");
        if (!remaining[stage].includes(item.id)) li.classList.add("gone");
        li.innerHTML = `<span>${item.label}</span><span class="tag ${item.type}">${item.type === "special" ? "specjalne" : "wiedza"}</span>`;
        box.appendChild(li);
      });

      document.getElementById("tab-etap1").classList.toggle("active", stage === "etap1");
      document.getElementById("tab-final").classList.toggle("active", stage === "final");

      const log = document.getElementById("log");
      log.innerHTML = history.length
        ? history.map((h, i) => {
            const item = catalog(h.id);
            return `<div class="item"><div class="n">${i + 1}. ${h.stage === "final" ? "Finał" : "Etap 1"}</div>${item ? item.label : h.id}</div>`;
          }).join("")
        : `<p class="hint">Tu pojawi się kolejność losowań.</p>`;

      spinBtn.disabled = spinning || !itemsNow().length;
    }

    function setStage(next) {
      if (spinning) return;
      stage = next;
      rotation = 0;
      rot.classList.remove("spinning");
      rot.style.transform = "rotate(0deg)";
      save();
      drawWheel();
      renderLists();
    }

    function ding() {
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = "triangle";
        o.frequency.value = 880;
        g.gain.value = 0.04;
        o.connect(g);
        g.connect(ac.destination);
        o.start();
        o.stop(ac.currentTime + 0.18);
      } catch (_) {}
    }

    function openResult(item) {
      pending = item;
      document.getElementById("result-kind").textContent =
        item.type === "special" ? "Pole specjalne" : "Kategoria wiedzy";
      document.getElementById("result-title").textContent = item.label;
      document.getElementById("result-note").textContent = item.type === "special"
        ? "Licytacja bez wkładu 500. Stawki idą do puli następnego pytania. Potem losujecie kategorię wiedzy."
        : "Kategoria schodzi z koła. Pytanie otwarte, 60 s na naradę.";
      const actions = document.getElementById("result-actions");
      actions.innerHTML = "";
      if (item.type === "special") {
        const keep = document.createElement("button");
        keep.textContent = "Zostaw na kole";
        keep.onclick = () => finishDraw(false);
        const take = document.createElement("button");
        take.className = "primary";
        take.textContent = "Wylicytowane — zdejmij";
        take.onclick = () => finishDraw(true);
        actions.append(keep, take);
      } else {
        const ok = document.createElement("button");
        ok.className = "primary";
        ok.textContent = "Dalej";
        ok.onclick = () => finishDraw(true);
        actions.append(ok);
      }
      overlay.classList.add("show");
    }

    function finishDraw(remove) {
      if (!pending) return;
      if (remove) {
        remaining[stage] = remaining[stage].filter((id) => id !== pending.id);
      }
      pending = null;
      overlay.classList.remove("show");
      rotation = 0;
      rot.classList.remove("spinning");
      rot.style.transform = "rotate(0deg)";
      save();
      drawWheel();
      renderLists();
    }

    function spin() {
      const items = itemsNow();
      if (spinning || !items.length) return;
      spinning = true;
      spinBtn.disabled = true;
      const index = Math.floor(Math.random() * items.length);
      const sliceDeg = 360 / items.length;
      const center = index * sliceDeg;
      const extra = 360 * (5 + Math.floor(Math.random() * 3));
      const target = extra + (360 - center);
      rotation = rotation + target;
      rot.classList.add("spinning");
      rot.style.transform = `rotate(${rotation}deg)`;

      const done = () => {
        rot.removeEventListener("transitionend", done);
        spinning = false;
        const item = items[index];
        history.unshift({ id: item.id, stage });
        ding();
        save();
        renderLists();
        openResult(item);
      };
      rot.addEventListener("transitionend", done);
    }

    function resetStage() {
      if (spinning) return;
      remaining[stage] = STAGES[stage].items.map((x) => x.id);
      history = history.filter((h) => h.stage !== stage);
      rotation = 0;
      rot.classList.remove("spinning");
      rot.style.transform = "rotate(0deg)";
      save();
      drawWheel();
      renderLists();
    }

    function resetAll() {
      if (spinning) return;
      remaining = {
        etap1: STAGES.etap1.items.map((x) => x.id),
        final: STAGES.final.items.map((x) => x.id)
      };
      history = [];
      rotation = 0;
      rot.classList.remove("spinning");
      rot.style.transform = "rotate(0deg)";
      save();
      drawWheel();
      renderLists();
    }

    document.getElementById("tab-etap1").onclick = () => setStage("etap1");
    document.getElementById("tab-final").onclick = () => setStage("final");
    spinBtn.onclick = spin;
    document.getElementById("reset-stage").onclick = resetStage;
    document.getElementById("reset-all").onclick = resetAll;
    document.getElementById("fullscreen").onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && !overlay.classList.contains("show")) {
        e.preventDefault();
        spin();
      }
    });

    load();
    drawWheel();
    renderLists();
  </script>
</body>
</html>
